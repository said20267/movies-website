<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سينما هب - موقع الأفلام</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1f1f1f;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #e50914;
    }
    header h1 {
      margin: 0;
      color: #e50914;
    }
    .search-box {
      margin-top: 15px;
    }
    .search-box input {
      padding: 10px;
      width: 60%;
      max-width: 400px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding: 30px;
    }
    .movie-card {
      background-color: #1f1f1f;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
    .movie-card:hover {
      transform: scale(1.05);
    }
    .movie-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }
    .movie-info {
      padding: 15px;
      text-align: center;
    }
    .movie-info h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }
    .rating {
      background-color: #e50914;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎬 سينما هب</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن فيلم..." onkeyup="searchMovies()">
    </div>
  </header>

  <div class="movies-grid" id="moviesContainer">
    <!-- ستظهر الأفلام هنا -->
  </div>

  <script>
    // بيانات تجريبية (يمكنك استبدالها لاحقاً بـ TMDB API)
    const sampleMovies = [
      { title: "Inception", rating: "8.8", poster: "https://image.tmdb.org/t/p/w500/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg" },
      { title: "Interstellar", rating: "8.7", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" },
      { title: "The Dark Knight", rating: "9.0", poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg" },
      { title: "Oppenheimer", rating: "8.1", poster: "https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg" }
    ];

    const container = document.getElementById('moviesContainer');

    function displayMovies(movies) {
      container.innerHTML = '';
      movies.forEach(movie => {
        container.innerHTML += `
          <div class="movie-card">
            <img src="${movie.poster}" alt="${movie.title}">
            <div class="movie-info">
              <h3>${movie.title}</h3>
              <span class="rating">⭐ ${movie.rating}</span>
            </div>
          </div>
        `;
      });
    }

    function searchMovies() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = sampleMovies.filter(m => m.title.toLowerCase().includes(query));
      displayMovies(filtered);
    }

    // عرض الأفلام عند فتح الصفحة
    displayMovies(sampleMovies);
  </script>

</body>
</html>
